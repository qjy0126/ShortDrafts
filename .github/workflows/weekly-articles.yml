name: Weekly articles

on:
  schedule:
    - cron: "0 2 * * 1,4"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Write this week's guide
        env:
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
          AGNES_BASE_URL: ${{ secrets.AGNES_BASE_URL }}
          AGNES_MODEL: ${{ secrets.AGNES_MODEL }}
        run: python scripts/weekly_article.py
      - name: Commit if the JSON changed
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Add this week's ShortDrafts use-case guide.
          file_pattern: assets/faq-articles.json assets/faq.js sitemap.xml use/*.html guides/*.html
